name: Godot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-smoke-test:
    name: Godot ${{ matrix.godot-version }} parse and smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.4", "4.7.2"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run data-layer smoke tests
        run: godot --headless --path . --script res://tests/headless_smoke.gd

      - name: Run main-scene gameplay smoke tests
        run: godot --headless --path . --script res://tests/game_flow_smoke.gd
